name: Site

on:
  push:
  pull_request:
  # Deploys are manual: Actions → Site → Run workflow with "deploy" checked
  # (or `gh workflow run site.yml -f deploy=true`). Pages source is "GitHub Actions".
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx astro check
      - run: npx playwright install --with-deps chromium
      - run: npm run contrast

  build:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
